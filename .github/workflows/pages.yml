# Builds and publishes sid-38.github.io:
#   - the blog (Jekyll, this folder): posts, /about, /mlcyber, /misc, and the old home page at /classic/
#   - the 3D room (Vite, room/), which goes on top as the home page
# Needs Settings → Pages → Source set to "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build the blog (same Jekyll setup GitHub Pages used before)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: room/package-lock.json

      - name: Build the 3D room
        working-directory: room
        run: |
          npm ci
          npm run build

      - name: Put the room on top as the home page
        run: sudo cp -r room/dist/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
